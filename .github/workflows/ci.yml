name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: '1.4.0'

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Validate theme contrast
        run: bun run validate:contrast

      # The repository intentionally commits placeholder Cloudflare ids. A
      # production build rejects them, while this local-only CI build reports
      # them and compiles without contacting Cloudflare.
      - name: Build application
        run: bun run build:ci

      # The coverage gate lives in vite.config.ts: vitest `thresholds` fail this
      # step below 95% on lines, functions, branches AND statements (AGENTS.md §1).
      #
      # A second jq-based step used to follow, nominally gating lines at 90%. It
      # read coverage/coverage-summary.json, which nothing produces — the reporters
      # are text/json/html/lcov, and the summary needs `json-summary`. `cat` failed,
      # the pipe masked its status, jq exited 0 on empty stdin, and `(( ))` on an
      # empty expression is false, so the step logged an error and always passed.
      # Removed rather than repaired: it was redundant with the thresholds above
      # even when working, and a weaker number in CI invited the drift it caused.
      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # No deploy step. Automatic Cloudflare Pages deploys are DISABLED for this repo
  # (Pages → NebulaKit → deployments_enabled = false), because NebulaKit is the
  # template: wrangler.toml ships placeholder resource ids on purpose, so the
  # `prebuild` binding guard fails every build by design. See 60f594e and
  # docs/CLOUDFLARE_SETUP.md. Derived projects paste their own ids and deploy
  # normally — the guidance in SETUP.md still applies to them, not to this repo.
  #
  # nebulakit.pages.dev / nebulakit.starspace.group still serve the last green
  # deploy (2d5c6f7, 2026-07-18) and will stay frozen there until deploys are
  # re-enabled.
  #
  # NOTE: bun.lock is the sole lockfile; package-lock.json was removed so the two
  # can no longer drift. The Pages build command installs with bun to match.
