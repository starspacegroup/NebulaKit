name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: '1.3.14'

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Check coverage threshold (90%)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "Coverage is below 90%!"
            exit 1
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # No deploy step. Automatic Cloudflare Pages deploys are DISABLED for this repo
  # (Pages → NebulaKit → deployments_enabled = false), because NebulaKit is the
  # template: wrangler.toml ships placeholder resource ids on purpose, so the
  # `prebuild` binding guard fails every build by design. See 60f594e and
  # docs/CLOUDFLARE_SETUP.md. Derived projects paste their own ids and deploy
  # normally — the guidance in SETUP.md still applies to them, not to this repo.
  #
  # nebulakit.pages.dev / nebulakit.starspace.group still serve the last green
  # deploy (2d5c6f7, 2026-07-18) and will stay frozen there until deploys are
  # re-enabled.
  #
  # NOTE: bun.lock is the sole lockfile; package-lock.json was removed so the two
  # can no longer drift. The Pages build command installs with bun to match.
