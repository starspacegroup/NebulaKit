name = "nebulakit"
compatibility_date = "2024-01-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# ─────────────────────────────────────────────────────────────────────────────
# RESOURCE IDS ARE PLACEHOLDERS. Run `bun run setup:cf` (or create them by hand)
# and paste YOUR ids below.
#
# Do NOT paste an id from another project. Cloudflare binds D1 and KV by **id**,
# not by name — `database_name` is a label wrangler never verifies. A wrong
# *name* is loud (`d1 migrations apply <name>` fails fast); a wrong *id* binds
# cleanly to somebody else's database and looks perfectly healthy.
#
# This template used to ship real ids. Six derived projects inherited them and
# all read/wrote one D1 + one KV — including shared OAuth secrets and a GitHub
# PAT. Hence placeholders that fail loudly. See docs/CLOUDFLARE_SETUP.md.
# ─────────────────────────────────────────────────────────────────────────────

# D1 Database — create with: wrangler d1 create <your-project>-db
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_ME-db"
database_id = "REPLACE_ME_RUN_SETUP_CF"
migrations_dir = "./migrations"

# KV Namespace — create with:
#   wrangler kv namespace create "KV"
#   wrangler kv namespace create "KV" --preview
# preview_id MUST differ from id, or `wrangler dev` writes straight into prod.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_ME_RUN_SETUP_CF"
preview_id = "REPLACE_ME_RUN_SETUP_CF_PREVIEW"
# R2 Bucket
# Create with: wrangler r2 bucket create nebulakit-files
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nebulakit-files"

# Queue (disabled - enable Queues at https://dash.cloudflare.com before uncommenting)
# [[queues.producers]]
# binding = "QUEUE"
# queue = "nebulakit-queue"

# Note: queues.consumers is not supported by Cloudflare Pages
# If you need queue consumers, use a separate Cloudflare Worker

# Environment Variables
# For production, set these in Cloudflare Pages settings
# For local dev, use .env file (see .env.example)
[vars]
# TURNSTILE_SECRET_KEY will be set via environment
# GITHUB_OWNER_ID - Set this to your GitHub user ID to enable admin access
# To find your GitHub ID: visit https://api.github.com/users/YOUR_USERNAME
# GITHUB_OWNER_ID = "YOUR_GITHUB_USER_ID_HERE"
